<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POGO 审美天梯对决 | Tinder 式独立音乐速配</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Supabase 客户端 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        retro: {
                            bg: '#e8e4d9',
                            card: '#f4f1e1',
                            text: '#2d2d2d',
                            accent: '#b23a48',
                            border: '#8a8571'
                        }
                    },
                    fontFamily: {
                        mono: ['"Courier New"', 'Courier', 'monospace', '"Microsoft YaHei"']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #e8e4d9;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        }
    </style>
</head>
<body class="font-mono text-retro-text min-h-screen flex flex-col items-center justify-center p-4 selection:bg-retro-accent selection:text-white">

    <div class="max-w-xl w-full bg-retro-card border-4 border-retro-text p-6 md:p-8 shadow-[8px_8px_0_0_#2d2d2d] relative">
        
        <header class="text-center mb-6 border-b-2 border-dashed border-retro-border pb-4">
            <h1 class="text-2xl md:text-3xl font-bold tracking-tighter">/// POGO 审美天梯对决 ///</h1>
            <p class="text-xs md:text-sm text-gray-600 mt-1">Tinder 式划卡速配 · 测测你和好友是不是现场同类</p>
        </header>

        <!-- 视图 1：欢迎与出题 -->
        <div id="view-home" class="space-y-4">
            <div class="bg-retro-bg p-4 border-2 border-retro-text text-sm">
                <p class="font-bold mb-2">💡 玩法说明：</p>
                <p class="text-gray-700 leading-relaxed">1. 输入你的乐迷昵称。<br>2. 系统将从云端题库中随机抽取一道灵魂考题。<br>3. 左右滑动（或点击按钮）选择你的态度，生成专属划卡链接发给好友，看你们能不能心有灵犀！</p>
            </div>
            <div>
                <label class="block text-xs font-bold mb-1 uppercase">你的乐迷代号</label>
                <input type="text" id="creator-name" placeholder="例如：鼓楼赵雷" class="w-full p-3 border-2 border-retro-text bg-white outline-none focus:border-retro-accent font-bold">
            </div>
            <button onclick="startCreation()" class="w-full bg-retro-text text-white font-bold py-3 hover:bg-retro-accent transition-colors border-2 border-transparent active:translate-y-1">
                [ 生成我的 POGO 划卡局 ]
            </button>
        </div>

        <!-- 视图 2：Tinder 卡片划卡互动区 -->
        <div id="view-quiz" class="hidden space-y-6">
            <div class="flex justify-between items-center text-xs font-bold border-b border-retro-text pb-2">
                <span id="quiz-role-title" class="bg-retro-accent text-white px-2 py-0.5">审美速配中...</span>
                <span id="question-progress">云端题库灵魂拷问</span>
            </div>

            <!-- 卡片主体 -->
            <div class="bg-white border-2 border-retro-text p-8 shadow-[6px_6px_0_0_#2d2d2d] min-h-[220px] flex flex-col justify-between text-center relative overflow-hidden">
                <div class="absolute top-2 left-2 text-[10px] text-gray-400 uppercase tracking-widest">POGO CARD</div>
                <h3 id="question-text" class="font-bold text-base md:text-lg my-auto text-retro-text leading-relaxed">正在从数据库加载题目...</h3>
                <div id="question-sub" class="text-xs text-retro-accent font-bold mt-2"></div>
            </div>

            <!-- Tinder 风格双按钮（左滑/右滑） -->
            <div class="flex space-x-4 pt-2">
                <button onclick="handleSwipe(false)" class="w-1/2 bg-gray-100 border-2 border-retro-text py-4 font-bold hover:bg-rose-100 hover:border-retro-accent transition-all text-xs md:text-sm flex items-center justify-center space-x-2 group">
                    <span class="text-lg text-retro-accent group-hover:scale-125 transition-transform">✕</span>
                    <span>绝对不听 (Swipe Left)</span>
                </button>
                <button onclick="handleSwipe(true)" class="w-1/2 bg-retro-text text-white border-2 border-retro-text py-4 font-bold hover:bg-retro-accent transition-all text-xs md:text-sm flex items-center justify-center space-x-2 group">
                    <span class="text-lg text-green-400 group-hover:scale-125 transition-transform">✓</span>
                    <span>懂的都懂 (Swipe Right)</span>
                </button>
            </div>
        </div>

        <!-- 视图 3：战报与连结页面 -->
        <div id="view-result" class="hidden space-y-6 text-center">
            <div class="border-4 border-double border-retro-text p-6 bg-retro-bg">
                <p class="text-xs uppercase font-bold text-gray-500 mb-1">POGO 审美速配战报</p>
                <h2 id="result-title" class="text-2xl font-bold text-retro-accent mb-2">【匹配成功】</h2>
                <div class="text-3xl font-extrabold my-4" id="score-display">灵魂契合度: 100%</div>
                <p id="result-desc" class="text-sm text-gray-700 leading-relaxed bg-white p-3 border border-retro-text">
                    你们在核心审美上完美同频，今晚的 Livehouse 现场见！
                </p>
            </div>

            <div id="share-action-box" class="space-y-3"></div>
        </div>

    </div>

    <script>
        const SUPABASE_URL = 'https://hrgzmwtgpacdxifcevwy.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_4XcXlLh77BtvmIajOGbpPA_T7d6b9fu';
        
        let dbClient = null;
        try {
            dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (e) {
            console.error('Supabase 初始化失败:', e);
        }

        let currentQuestion = null;
        let mode = 'creator'; 
        let userName = '';
        let targetDuelId = null;
        let creatorChoice = null;
        let creatorNameData = '';

        window.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const duelId = params.get('duel');
            if (duelId) {
                mode = 'challenger';
                targetDuelId = duelId;
                document.getElementById('quiz-role-title').innerText = '应战好友的 Tinder 划卡局';
                fetchDuelData(duelId);
            } else {
                // 如果是新用户，直接从数据库的 fallback_questions 表中随机抽一题
                await fetchRandomQuestionFromDB();
            }
        });

        async function fetchRandomQuestionFromDB() {
            if (!dbClient) return;
            const { data, error } = await dbClient
                .from('fallback_questions')
                .select('*');

            if (error || !data || data.length === 0) {
                // 兜底保护：如果云端没取到，给个默认硬核题
                currentQuestion = {
                    text: "深夜一个人在房间，耳机里必须是长达15分钟、没有任何人声的宏大后摇。",
                    sub: "—— 关于孤独与失真电流"
                };
                return;
            }

            // 随机抽出一道
            const randomIndex = Math.floor(Math.random() * data.length);
            currentQuestion = {
                text: data[randomIndex].text,
                sub: data[randomIndex].sub
            };
        }

        async function startCreation() {
            const nameInput = document.getElementById('creator-name').value.trim();
            if (!nameInput) {
                alert('请先输入你的乐迷代号！');
                return;
            }
            if (!currentQuestion) {
                alert('题目正在从云端加载，请稍候再试！');
                return;
            }
            userName = nameInput;
            document.getElementById('quiz-role-title').innerText = `发起者: ${userName}`;
            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-quiz').classList.remove('hidden');
            renderCard();
        }

        function renderCard() {
            document.getElementById('question-text').innerText = currentQuestion.text;
            document.getElementById('question-sub').innerText = currentQuestion.sub;
        }

        async function handleSwipe(choice) {
            if (mode === 'creator') {
                creatorChoice = choice;
                if (!dbClient) {
                    alert('数据库未连接！');
                    return;
                }

                const { data, error } = await dbClient
                    .from('music_duels')
                    .insert([{ 
                        creator_name: userName, 
                        creator_answers: { 
                            text: currentQuestion.text, 
                            sub: currentQuestion.sub, 
                            choice: creatorChoice 
                        } 
                    }])
                    .select()
                    .single();

                if (error) {
                    alert('生成划卡链接失败: ' + error.message);
                    return;
                }

                const duelId = data.id;
                const shareUrl = window.location.origin + window.location.pathname + '?duel=' + duelId;

                document.getElementById('view-quiz').classList.add('hidden');
                document.getElementById('view-result').classList.remove('hidden');
                document.getElementById('result-title').innerText = '【Pogo 划卡局已生成】';
                document.getElementById('score-display').innerText = '等待好友右滑应战';
                document.getElementById('result-desc').innerHTML = `你的专属 Tinder 审美卡片已就绪！点击下方按钮复制链接发给好友，看看你们能不能在音乐审美上一拍即合。`;
                document.getElementById('share-action-box').innerHTML = `
                    <button onclick="navigator.clipboard.writeText('${shareUrl}'); alert('划卡挑战链接已复制，快发给好友吧！');" class="w-full bg-retro-accent text-white font-bold py-3 hover:opacity-90 border-2 border-retro-text">
                        [ 复制 Tinder 挑战链接 ]
                    </button>
                `;

            } else {
                document.getElementById('view-quiz').classList.add('hidden');
                document.getElementById('view-result').classList.remove('hidden');

                const isMatched = (choice === creatorChoice);

                if (isMatched) {
                    document.getElementById('result-title').innerText = '【🎯 完美右滑：天生同类】';
                    document.getElementById('score-display').innerText = '契合度: 100%';
                    document.getElementById('result-desc').innerText = `你和 [${creatorNameData}] 的选择完全一致！你们拥有相同的音乐磁场，今晚很适合一起去前排跳水。`;
                } else {
                    document.getElementById('result-title').innerText = '【⚡ 轨道偏离：审美摩擦】';
                    document.getElementById('score-display').innerText = '契合度: 0%';
                    document.getElementById('result-desc').innerText = `笑死，你和 [${creatorNameData}] 的选择截然相反！在独立音乐的世界里，你们俩大概率会在现场因为意见不合而互踩帆布鞋。`;
                }

                document.getElementById('share-action-box').innerHTML = `
                    <button onclick="window.location.href = window.location.pathname;" class="w-full bg-retro-text text-white font-bold py-3 hover:bg-retro-accent border-2">
                        [ 我也要创建我的划卡局 ]
                    </button>
                `;
            }
        }

        async function fetchDuelData(duelId) {
            if (!dbClient) return;
            const { data, error } = await dbClient
                .from('music_duels')
                .select('*')
                .eq('id', duelId)
                .single();

            if (error || !data) {
                alert('该划卡对决链接已失效或不存在！');
                window.location.href = window.location.pathname;
                return;
            }

            creatorNameData = data.creator_name;
            creatorChoice = data.creator_answers.choice;
            currentQuestion = {
                text: data.creator_answers.text,
                sub: data.creator_answers.sub
            };

            document.getElementById('view-home').innerHTML = `
                <div>
                    <label class="block text-xs font-bold mb-1 uppercase">你正在应战 [ ${creatorNameData} ] 的审美卡片</label>
                    <input type="text" id="challenger-name" placeholder="输入你的乐迷昵称" class="w-full p-3 border-2 border-retro-text bg-white outline-none focus:border-retro-accent font-bold mb-4">
                    <button onclick="startChallengerQuiz()" class="w-full bg-retro-text text-white font-bold py-3 hover:bg-retro-accent transition-colors border-2">
                        [ 开始 Tinder 划卡对决 ]
                    </button>
                </div>
            `;
        }

        function startChallengerQuiz() {
            const nameInput = document.getElementById('challenger-name').value.trim();
            if (!nameInput) {
                alert('请输入你的昵称才能开始划卡！');
                return;
            }
            userName = nameInput;
            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-quiz').classList.remove('hidden');
            renderCard();
        }
    </script>
</body>
</html>
