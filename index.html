<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POGO 审美天梯对决 | 测测你们能不能一起去现场撞击</title>
    <!-- 引入 Tailwind CSS (复古朋克/独立杂志风配色) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Supabase JS 客户端 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        retro: {
                            bg: '#e8e4d9',      /* 旧报纸底色 */
                            card: '#f4f1e1',    /* 偏黄的卡片色 */
                            text: '#2d2d2d',    /* 褪色的炭黑 */
                            accent: '#b23a48',  /* 黯淡的失真红 */
                            border: '#8a8571'   /* 粗粝边框色 */
                        }
                    },
                    fontFamily: {
                        mono: ['"Courier New"', 'Courier', 'monospace', '"Microsoft YaHei"']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #e8e4d9;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        }
    </style>
</head>
<body class="font-mono text-retro-text min-h-screen flex flex-col items-center justify-center p-4 selection:bg-retro-accent selection:text-white">

    <div class="max-w-xl w-full bg-retro-card border-4 border-retro-text p-6 md:p-8 shadow-[8px_8px_0_0_#2d2d2d] relative">
        
        <!-- 页面标题 -->
        <header class="text-center mb-6 border-b-2 border-dashed border-retro-border pb-4">
            <h1 class="text-2xl md:text-3xl font-bold tracking-tighter">/// POGO 审美天梯对决 ///</h1>
            <p class="text-xs md:text-sm text-gray-600 mt-1">划卡对决 · 看看你和好友是不是能一起去 Pogo 圈撞击的同类</p>
        </header>

        <!-- 视图 1：欢迎/创建测试页面 -->
        <div id="view-home" class="space-y-4">
            <div class="bg-retro-bg p-4 border-2 border-retro-text text-sm">
                <p class="font-bold mb-2">💡 玩法说明：</p>
                <p class="text-gray-700 leading-relaxed">1. 输入你的乐迷昵称，完成 5 道独立音乐灵魂拷问。<br>2. 生成专属的 Pogo 挑战链接发给好友。<br>3. 看看你们的契合度是能一起手拉手跳水，还是在现场互踩帆布鞋！</p>
            </div>
            <div>
                <label class="block text-xs font-bold mb-1 uppercase">你的乐迷代号</label>
                <input type="text" id="creator-name" placeholder="例如：鼓楼张曼玉" class="w-full p-3 border-2 border-retro-text bg-white outline-none focus:border-retro-accent font-bold">
            </div>
            <button onclick="startCreation()" class="w-full bg-retro-text text-white font-bold py-3 hover:bg-retro-accent transition-colors border-2 border-transparent active:translate-y-1">
                [ 开启我的 POGO 天梯局 ]
            </button>
        </div>

        <!-- 视图 2：答题/划卡互动区 -->
        <div id="view-quiz" class="hidden space-y-6">
            <div class="flex justify-between items-center text-xs font-bold border-b border-retro-text pb-2">
                <span id="quiz-role-title" class="bg-retro-accent text-white px-2 py-0.5">正在对决...</span>
                <span id="question-progress">进度: 1 / 5</span>
            </div>

            <!-- 题目卡片 -->
            <div id="card-container" class="bg-white border-2 border-retro-text p-6 shadow-[4px_4px_0_0_#2d2d2d] min-h-[180px] flex flex-col justify-between">
                <h3 id="question-text" class="font-bold text-base md:text-lg mb-4">加载中...</h3>
                <div class="space-y-2" id="options-container">
                    <!-- 选项由 JS 动态注入 -->
                </div>
            </div>

            <div class="flex space-x-4">
                <button onclick="handleAnswer(false)" class="w-1/2 bg-gray-200 border-2 border-retro-text py-3 font-bold hover:bg-gray-300 transition-colors">
                    ✕ 绝对不听 (Dislike)
                </button>
                <button onclick="handleAnswer(true)" class="w-1/2 bg-retro-text text-white border-2 border-retro-text py-3 font-bold hover:bg-retro-accent transition-colors">
                    ✓ 懂的都懂 (Like)
                </button>
            </div>
        </div>

        <!-- 视图 3：战报与分享页面 -->
        <div id="view-result" class="hidden space-y-6 text-center">
            <div class="border-4 border-double border-retro-text p-6 bg-retro-bg">
                <p class="text-xs uppercase font-bold text-gray-500 mb-1">POGO 审美天梯战报</p>
                <h2 id="result-title" class="text-2xl font-bold text-retro-accent mb-2">【建议立刻组乐队结婚】</h2>
                <div class="text-4xl font-extrabold my-4" id="score-display">契合度: 95%</div>
                <p id="result-desc" class="text-sm text-gray-700 leading-relaxed bg-white p-3 border border-retro-text">
                    你们的耳机里流淌着相同的失真电流。在 Pogo 现场，你们大概率会默契地互递矿泉水。
                </p>
            </div>

            <div id="share-action-box" class="space-y-3">
                <!-- 动态根据身份展示 -->
            </div>
        </div>

    </div>

    <!-- 核心逻辑脚本 -->
    <script>
        // 已填入正确的 Supabase 根域名及发布密钥
        const SUPABASE_URL = 'https://hrgzmwtgpacdxifcevwy.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_4XcXlLh77BtvmIajOGbpPA_T7d6b9fu';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 5 道核心灵魂拷问题目库
        const questions = [
            { id: 1, text: "Q1: 怎么看待独立乐队去上主流音综（比如《乐队的夏天》）？", optA: "时代的眼泪，终于能恰饱饭了，理解并尊重。", optB: "彻底商业化变味了，现在的现场越来越没法看。" },
            { id: 2, text: "Q2: 深夜一个人在房间，耳机里放的是？", optA: "长达15分钟、没有任何人声的宏大后摇。", optB: "粗糙破音、主唱随时可能跑调的地下朋克。" },
            { id: 3, text: "Q3: 面对 Livehouse 演出时，你的身体本能是？", optA: "站在调音台旁边冷静观察，绝不轻易被人群推搡。", optB: "失真一响直接冲进 Pogo 圈，把地板踩得震天响！" },
            { id: 4, text: "Q4: 如果买了一张极其冷门、全网只有几十个人听过的乐队黑胶，你的心态是？", optA: "狂喜！觉得全世界只有自己掌握了宇宙真理，秘不示人。", optB: "疯狂安利！恨不得在每个社交平台当野生宣发。" },
            { id: 5, text: "Q5: 如何定义一个“真正的”硬核独立乐迷？", optA: "钱包永远空空，但每个周末的排练室和Livehouse都有他的身影。", optB: "只要听歌够冷门，哪怕在台下当个冷漠的观察员也算。" }
        ];

        let currentIdx = 0;
        let userAnswers = []; 
        let mode = 'creator'; 
        let creatorName = '';
        let targetDuelId = null;
        let creatorAnswersData = [];

        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const duelId = params.get('duel');
            if (duelId) {
                mode = 'challenger';
                targetDuelId = duelId;
                document.getElementById('quiz-role-title').innerText = '正在应战好友的 Pogo 对决';
                fetchDuelData(duelId);
            }
        });

        function startCreation() {
            const nameInput = document.getElementById('creator-name').value.trim();
            if (!nameInput) {
                alert('请先输入你的乐迷代号！');
                return;
            }
            creatorName = nameInput;
            mode = 'creator';
            document.getElementById('quiz-role-title').innerText = `发起者: ${creatorName}`;
            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-quiz').classList.remove('hidden');
            renderQuestion();
        }

        function renderQuestion() {
            if (currentIdx >= questions.length) {
                finishQuiz();
                return;
            }
            const q = questions[currentIdx];
            document.getElementById('question-progress').innerText = `进度: ${currentIdx + 1} / ${questions.length}`;
            document.getElementById('question-text').innerText = q.text;
            
            const optionsHtml = `
                <div class="text-xs bg-retro-bg p-2 border border-retro-border"><b>[选项A]</b> ${q.optA}</div>
                <div class="text-xs bg-retro-bg p-2 border border-retro-border"><b>[选项B]</b> ${q.optB} (视为同意/Like)</div>
            `;
            document.getElementById('options-container').innerHTML = optionsHtml;
        }

        function handleAnswer(choice) {
            userAnswers.push(choice);
            currentIdx++;
            renderQuestion();
        }

        async function fetchDuelData(duelId) {
            const { data, error } = await supabase
                .from('music_duels')
                .select('*')
                .eq('id', duelId)
                .single();

            if (error || !data) {
                alert('该对决链接已失效或不存在！');
                window.location.href = window.location.pathname;
                return;
            }
            creatorName = data.creator_name;
            creatorAnswersData = data.creator_answers;
            
            document.getElementById('view-home').innerHTML = `
                <div>
                    <label class="block text-xs font-bold mb-1 uppercase">你正在应战 [ ${creatorName} ] 的 Pogo 局</label>
                    <input type="text" id="challenger-name" placeholder="输入你的乐迷昵称" class="w-full p-3 border-2 border-retro-text bg-white outline-none focus:border-retro-accent font-bold mb-4">
                    <button onclick="startChallengerQuiz()" class="w-full bg-retro-text text-white font-bold py-3 hover:bg-retro-accent transition-colors border-2">
                        [ 接受 Pogo 挑战并开始划卡 ]
                    </button>
                </div>
            `;
        }

        function startChallengerQuiz() {
            const nameInput = document.getElementById('challenger-name').value.trim();
            if (!nameInput) {
                alert('请输入你的昵称才能开始对决！');
                return;
            }
            creatorName = nameInput;
            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-quiz').classList.remove('hidden');
            renderQuestion();
        }

        async function finishQuiz() {
            document.getElementById('view-quiz').classList.add('hidden');
            document.getElementById('view-result').classList.remove('hidden');

            if (mode === 'creator') {
                const { data, error } = await supabase
                    .from('music_duels')
                    .insert([{ creator_name: creatorName, creator_answers: userAnswers }])
                    .select()
                    .single();

                if (error) {
                    alert('生成链接失败: ' + error.message);
                    return;
                }

                const duelId = data.id;
                const shareUrl = window.location.origin + window.location.pathname + '?duel=' + duelId;

                document.getElementById('result-title').innerText = '【Pogo 天梯局已生成】';
                document.getElementById('score-display').innerText = '等待好友应战';
                document.getElementById('result-desc').innerHTML = `你的 Pogo 审美天梯局已就绪！点击下方按钮复制链接，发给好友来看看你们能不能一起去现场冲撞。`;
                document.getElementById('share-action-box').innerHTML = `
                    <button onclick="navigator.clipboard.writeText('${shareUrl}'); alert('挑战链接已复制，快发给小伙伴吧！');" class="w-full bg-retro-accent text-white font-bold py-3 hover:opacity-90 border-2 border-retro-text">
                        [ 复制 Pogo 挑战链接 ]
                    </button>
                `;

            } else {
                let matchCount = 0;
                for (let i = 0; i < userAnswers.length; i++) {
                    if (userAnswers[i] === creatorAnswersData[i]) {
                        matchCount++;
                    }
                }
                const score = Math.round((matchCount / questions.length) * 100);

                let title = '', desc = '';
                if (score >= 80) {
                    title = '【Pogo 黄金搭档：建议原地组乐队】';
                    desc = `你们的契合度高达 ${score}%！在 Pogo 圈里你们不仅能完美避开彼此的拳头，还能在摔倒时第一时间把对方捞起来。`;
                } else if (score >= 40) {
                    title = '【相敬如宾的围观群众】';
                    desc = `你们的契合度为 ${score}%。虽然在部分老乐队上略有分歧，但站在Livehouse后方安静看演出还是挺和谐的。`;
                } else {
                    title = '【现场碰见大概率会互踩帆布鞋并绝交】';
                    desc = `救命，契合度仅有 ${score}%！你们俩的音乐审美简直跨物种，去现场大概率会在 Pogo 圈里互相把对方撞飞。`;
                }

                document.getElementById('result-title').innerText = title;
                document.getElementById('score-display').innerText = `契合度: ${score}%`;
                document.getElementById('result-desc').innerText = desc;
                document.getElementById('share-action-box').innerHTML = `
                    <button onclick="window.location.href = window.location.pathname;" class="w-full bg-retro-text text-white font-bold py-3 hover:bg-retro-accent border-2">
                        [ 我也要创建我的 Pogo 局 ]
                    </button>
                `;
            }
        }
    </script>
</body>
</html>
